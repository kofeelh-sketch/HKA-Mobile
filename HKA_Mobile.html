<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0D1A1C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HKA Mobile</title>
<style>
:root{--bg:#0D1A1C;--card:#142529;--line:#1E3438;--bord:#24413F;--txt:#E7F0EE;--mut:#7A9490;--mut2:#9DB5B1;--acc:#3EC6B8;--accd:#062421;--gold:#E8B84B;--dim:#5E7672;--warn:#E8B84B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;max-width:430px;margin:0 auto;padding-bottom:92px;min-height:100vh}
.hdr{padding:18px 18px 10px}
.brand{font-size:13px;letter-spacing:.22em;color:var(--acc);font-weight:700}
.sub{font-size:12px;color:var(--mut);margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 14px}
label{font-size:11px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase;display:block;margin-bottom:6px}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--bord);border-radius:10px;color:var(--txt);padding:12px;font-size:16px;outline:none;font-family:inherit}
input::placeholder{color:#4E6663}
.gap{height:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1 1 45%;padding:13px 0;border-radius:10px;text-align:center;font-size:15px;font-weight:600;cursor:pointer;background:var(--bg);color:var(--mut2);border:1px solid var(--bord);user-select:none}
.chip.on{background:var(--acc);color:var(--accd);border-color:var(--acc)}
.step{width:52px;height:52px;border-radius:10px;background:var(--bg);border:1px solid var(--bord);color:var(--acc);font-size:26px;font-weight:700;cursor:pointer}
.montant{font-size:40px;font-weight:700;color:var(--gold);text-align:center;padding:8px 0 2px;font-variant-numeric:tabular-nums}
.big{display:block;width:calc(100% - 28px);margin:6px 14px;padding:16px 0;border-radius:12px;border:none;background:var(--acc);color:var(--accd);font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
.big.ghost{background:var(--card);color:var(--acc);border:1px solid var(--acc)}
.big.danger{background:var(--card);color:#E8836B;border:1px solid #E8836B}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;display:flex;background:#0A1416;border-top:1px solid var(--line)}
.nav div{flex:1;padding:13px 0 16px;text-align:center;cursor:pointer;color:var(--dim);font-size:11px;font-weight:600;border-top:2px solid transparent;position:relative}
.nav div.on{color:var(--acc);border-top-color:var(--acc)}
.dot{position:absolute;top:8px;right:16%;width:8px;height:8px;border-radius:4px;background:var(--warn)}
.kpis{display:flex;padding:14px 8px}
.kpi{flex:1;text-align:center}
.kpi b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;display:block}
.kpi span{font-size:10px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase;margin-top:3px;display:block}
.bar{margin:0 14px;height:4px;background:var(--card);border-radius:2px}
.bar i{display:block;height:4px;background:var(--acc);border-radius:2px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
.row:last-child{border-bottom:none}
.del{color:var(--dim);cursor:pointer;font-size:18px;background:none;border:none;padding:0 4px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--line);color:var(--txt);padding:10px 18px;border-radius:20px;font-size:14px;border:1px solid var(--acc);z-index:50;white-space:nowrap;display:none}
.sugg{background:var(--card);border:1px solid var(--bord);border-radius:10px;margin-top:4px;max-height:210px;overflow-y:auto}
.sugg div{padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.sugg div:last-child{border-bottom:none}
.sugg small{color:var(--mut);display:block;font-size:12px}
.muted{color:var(--mut2);font-size:13px;line-height:1.5}
.badge{font-size:11px;color:var(--acc);border:1px solid var(--acc);border-radius:10px;padding:1px 8px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.banner{margin:10px 14px;padding:12px 14px;border-radius:12px;background:#2A2416;border:1px solid var(--warn);color:var(--warn);font-size:13px;line-height:1.4}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mnav button{background:var(--bg);border:1px solid var(--bord);color:var(--acc);width:42px;height:42px;border-radius:10px;font-size:20px;cursor:pointer}
.mnav b{font-size:16px;letter-spacing:.06em}
.drow{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.drow:last-child{border-bottom:none}
.drow.zero{color:var(--dim)}
.drow.best{color:var(--gold);font-weight:700}
.ok{color:#4CC38A}.ko{color:#E8836B}.drow.ok{color:#4CC38A}.drow.ko{color:#E8836B}.drow.gold{color:var(--gold);font-weight:700}
</style>
</head>

function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fr(iso){const [y,m,d]=iso.split('-');return d+'/'+m+'/'+y}

function joursDepuisExport(){ if(!lastExport) return null; return Math.floor((Date.now()-lastExport)/86400000) }
function rappelActif(){ const j=joursDepuisExport(); const n=txs.filter(t=>!t.exporte).length+deps.filter(d=>!d.exporte).length; return n>0 && (j===null || j>=RAPPEL_JOURS) }
function joursDepuisBackup(){ if(!lastBackup) return null; return Math.floor((Date.now()-lastBackup)/86400000) }
function rappelBackup(){ const j=joursDepuisBackup(); return txs.length>0 && (j===null || j>=RAPPEL_BACKUP) }

function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function diffDays(a,b){return Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/86400000)}
function relancesDues(){
  const t=today(), out=[];
  for(const cl of CYCLES){
    // dernier séjour effectif = max(classeur, saisies app avec montant > 0)
    let dernier=cl.k;
    for(const tx of txs){ if(tx.nom===cl.n && tx.montant>0 && tx.date>dernier) dernier=tx.date }
    const due=addDays(dernier,cl.cy);
    const dj=diffDays(due,t);
    if(dj>RELANCE_FENETRE) continue;
    // relancé récemment ? masqué tant que : pas de nouveau séjour ET moins d'un cycle depuis la relance
    const r=relanced[cl.n];
    if(r && r.k===dernier && diffDays(t,r.d)<cl.cy) continue;
    out.push({...cl,k:dernier,due,dj});
  }
  return out.sort((a,b)=>a.dj-b.dj);
}
function waLink(c){
  let n=String(c||'').replace(/[^0-9]/g,'');
  if(n.startsWith('00')) n=n.slice(2);
  if(n.length===9&&n.startsWith('7')) n='221'+n;
  return n?('https://wa.me/'+n):'';
}

const CRC_T=(()=>{let t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function u8(s){return new TextEncoder().encode(s)}
function makeZip(files){
  let parts=[],central=[],off=0;
  for(const f of files){
    const name=u8(f.name), data=u8(f.data), crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,0,true);lh.setUint16(12,0,true);lh.setUint32(14,crc,true);
    lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
    ch.setUint16(12,0,true);ch.setUint16(14,0,true);ch.setUint32(16,crc,true);
    ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);
    ch.setUint16(28,name.length,true);
    ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),name);
    off+=30+name.length+data.length;
  }
  let cdLen=0; central.forEach(p=>cdLen+=p.length);
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true);eo.setUint16(8,files.length,true);eo.setUint16(10,files.length,true);
  eo.setUint32(12,cdLen,true);eo.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(eo.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

  else if(tab==='periode') P.innerHTML=viewPeriode();
  else if(tab==='clients') P.innerHTML=viewClients();
  else P.innerHTML=viewExport();
  bind();
}

function suggHTML(q){
  q=q.trim().toLowerCase(); if(q.length<2) return '';
  const res=allClients().filter(c=>c.n.toLowerCase().includes(q)||c.c.includes(q)).slice(0,8);
  if(!res.length) return '';
  return '<div class="sugg">'+res.map(c=>
    '<div data-nom="'+esc(c.n)+'" data-c="'+esc(c.c)+'" data-s="'+(c.s||0)+'" class="pick">'+esc(c.n)+(c.neu?' <span class="badge">nouveau</span>':'')+
    '<small>'+esc(c.c||'—')+' · '+esc(c.v||'')+(c.s?' · '+c.s+' séjours':'')+'</small></div>').join('')+'</div>';
}

    const open = d===t0 || openDays[d];

    const dList=gd[d]||[];

        <div class="ell"><div style="font-weight:600" class="ell">${esc(t.nom)} ${t.exporte?'· ✓':''}</div>
        <div style="font-size:12px;color:var(--mut)">${t.presta} · ${t.slots} slot${t.slots>1?'s':''} · ${t.type}</div></div>

    return `<div class="card" style="padding:${open?'16px':'12px 16px'}">${head}${body}</div>`;

}

function viewPeriode(){
  const nbJours=new Date(perY,perM+1,0).getDate();
  const key=perY+'-'+String(perM+1).padStart(2,'0');
  const perTx=txs.filter(t=>t.date.slice(0,7)===key);
  const parJour=Array(nbJours+1).fill(0), nbParJour=Array(nbJours+1).fill(0);
  perTx.forEach(t=>{const d=Number(t.date.slice(8,10));parJour[d]+=t.montant;nbParJour[d]++});
  const total=parJour.reduce((s,x)=>s+x,0);
  const joursActifs=parJour.filter(x=>x>0).length;
  const max=Math.max(...parJour,1);
  let best=0,worst=0;
  parJour.forEach((v,i)=>{if(i>0&&v>parJour[best])best=i});
  parJour.forEach((v,i)=>{if(i>0&&v>0&&(worst===0||v<parJour[worst]))worst=i});
  // graphique barres SVG
  const W=372,H=150,bw=W/nbJours;
  let bars='';
  for(let d=1;d<=nbJours;d++){
    const h=parJour[d]/max*(H-28);
    const x=(d-1)*bw;
    const col = d===best&&parJour[d]>0 ? '#E8B84B' : (parJour[d]>=SEUIL_JOUR ? '#4CC38A' : '#E8836B');
    bars+=`<rect x="${(x+1).toFixed(1)}" y="${(H-20-h).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${col}"/>`;
    if(d===1||d%5===0||d===nbJours) bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-6}" font-size="9" fill="#7A9490" text-anchor="middle">${d}</text>`;
  }
  const rows=[];
  for(let d=1;d<=nbJours;d++){
    const cls=parJour[d]===0?'zero':(d===best?'gold':(parJour[d]>=SEUIL_JOUR?'ok':'ko'));
    rows.push(`<div class="drow ${cls}"><span>${String(d).padStart(2,'0')}/${String(perM+1).padStart(2,'0')}</span><span>${nbParJour[d]||'—'} tx</span><span>${parJour[d]?fcfa(parJour[d]):'—'}</span></div>`);
  }
  // Décades (3 x 10 jours) et Pentades (6 x 5 jours)
  function tranche(d1,d2){let r=0,n=0;for(let d=d1;d<=Math.min(d2,nbJours);d++){r+=parJour[d];n+=nbParJour[d]}return r}
  const objDec=OBJECTIF/3, objPen=OBJECTIF/6;
  const decs=[[1,10],[11,20],[21,nbJours]].map(([a,b],i)=>{
    const r=tranche(a,b),p=Math.round(r/objDec*100);
    const cls=r===0?'zero':(p>=100?'ok':(p>=50?'gold':'ko'));
    return `<div class="drow ${cls}"><span>Décade ${i+1} · ${String(a).padStart(2,'0')}→${String(b).padStart(2,'0')}</span><span>${r?fcfa(r):'—'}</span><span style="min-width:44px;text-align:right">${p}%</span></div>`;
  }).join('');
  const pens=[[1,5],[6,10],[11,15],[16,20],[21,25],[26,nbJours]].map(([a,b],i)=>{
    const r=tranche(a,b),p=Math.round(r/objPen*100);
    const cls=r===0?'zero':(p>=100?'ok':(p>=50?'gold':'ko'));
    return `<div class="drow ${cls}"><span>Pentade ${i+1} · ${String(a).padStart(2,'0')}→${String(b).padStart(2,'0')}</span><span>${r?fcfa(r):'—'}</span><span style="min-width:44px;text-align:right">${p}%</span></div>`;
  }).join('');
  return `<div class="card">
    <div class="mnav">
      <button id="mPrev">‹</button>
      <b>${MOIS[perM]} ${perY}</b>
      <button id="mNext">›</button>
    </div>
    <div style="display:flex;gap:8px;text-align:center;margin-bottom:10px">
      <div style="flex:1"><div style="font-size:16px;font-weight:700;color:var(--gold)">${fcfa(total)}</div><div style="font-size:10px;color:var(--mut)">TOTAL</div></div>
      <div style="flex:1"><div style="font-size:16px;font-weight:700">${joursActifs?fcfa(Math.round(total/joursActifs)):'—'}</div><div style="font-size:10px;color:var(--mut)">MOY/JOUR ACTIF</div></div>
      <div style="flex:1"><div style="font-size:16px;font-weight:700;color:var(--acc)">${best&&parJour[best]?String(best).padStart(2,'0'):'—'}</div><div style="font-size:10px;color:var(--mut)">MEILLEUR JOUR</div></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">${bars}</svg>
  </div>
  <div style="display:flex;gap:12px;justify-content:center;margin:-4px 14px 0;font-size:11px;color:var(--mut)">
    <span><span class="ok">■</span> ≥ ${fcfa(SEUIL_JOUR)}</span>
    <span><span class="ko">■</span> &lt; ${fcfa(SEUIL_JOUR)}</span>
    <span><span style="color:var(--gold)">■</span> meilleur jour</span>
  </div>
  <div class="card">
    <label>Objectifs par décade — 3 × 10 jours (obj. ${fcfa(OBJECTIF/3)})</label>
    ${decs}
  </div>
  <div class="card">
    <label>Objectifs par phase — 6 × 5 jours (obj. ${fcfa(OBJECTIF/6)})</label>
    ${pens}
  </div>
  <div class="card">
    <label>Détail jour par jour</label>
    ${rows.join('')}
  </div>`;
}

  const aDp=deps.filter(d=>!d.exporte);
  const nbExp=txs.filter(t=>t.exporte).length+deps.filter(d=>d.exporte).length;
  const j=joursDepuisExport();
  return `<div class="card">
    <b>${aTx.length} transaction${aTx.length>1?'s':''}, ${aDp.length} dépense${aDp.length>1?'s':''} et ${aCl.length} client${aCl.length>1?'s':''} à exporter</b>
    <div class="muted" style="margin-top:6px">${j===null?'Aucun export effectué pour l\'instant.':'Dernier export : il y a '+j+' jour'+(j>1?'s':'')+'.'}
    ${joursDepuisBackup()===null?'Aucune sauvegarde JSON effectuée.':'Dernière sauvegarde JSON : il y a '+joursDepuisBackup()+' jour'+(joursDepuisBackup()>1?'s':'')+'.'}
    Le fichier Excel contient 2 feuilles prêtes à coller : JOURNAL (à partir de la colonne D) et CLIENTS (colonnes D/E). Instructions dans la feuille NOTICE.</div>
  </div>
  ${(aTx.length||aCl.length||aDp.length)?`

  ${nbExp?`<div class="card">
    <b>Nettoyage annuel</b>
    <div class="muted" style="margin-top:6px">${nbExp} transaction${nbExp>1?'s':''} déjà exportée${nbExp>1?'s':''} conservée${nbExp>1?'s':''} dans l'app pour l'historique (Période, comparaisons de mois). À faire une fois par an (1er janvier), après une dernière sauvegarde JSON : supprime tout pour repartir sur une année propre.</div>

// ————— BINDINGS —————
function bind(){
  document.querySelectorAll('#nav div').forEach(d=>d.onclick=()=>{tab=d.dataset.t;render()});
  const g=id=>document.getElementById(id);
  if(tab==='saisie'){
    document.querySelectorAll('.mode').forEach(c=>c.onclick=()=>{saisieMode=c.dataset.m;render()});
    if(saisieMode==='dep'){
      g('dDate').onchange=e=>D.date=e.target.value;
      g('dMontant').oninput=e=>{D.montant=e.target.value;};
      g('dMontant').onchange=()=>render();
      g('dNote').oninput=e=>D.note=e.target.value;
      document.querySelectorAll('.rub').forEach(c=>c.onclick=()=>{D.rub=c.dataset.r;render()});
      g('btnSaveDep').onclick=()=>{
        if(!D.rub){toast('Choisis une rubrique');return}
        if(!(Number(D.montant)>0)){toast('Montant requis');return}
        const cat=(RUBRIQUES.find(x=>x.r===D.rub)||{}).c||'';
        deps.unshift({id:Date.now(),date:D.date,rub:D.rub,cat,montant:Number(D.montant),note:D.note.trim(),exporte:false});
        SV('hka_deps',deps);
        toast('✓ − '+fcfa(D.montant)+' enregistré');
        D={...D,montant:'',note:''}; render();
      };
      return;
    }
    g('fDate').onchange=e=>F.date=e.target.value;
    g('fNom').oninput=e=>{F.nom=e.target.value;g('suggBox').innerHTML=suggHTML(F.nom);bindPick()};
    g('fContact').oninput=e=>F.contact=e.target.value;
    g('fTarif').oninput=e=>F.tarif=e.target.value;
    g('fNotes').oninput=e=>F.notes=e.target.value;
    g('sMinus').onclick=()=>{F.slots=Math.max(1,F.slots-1);render()};
    g('sPlus').onclick=()=>{F.slots++;render()};
    document.querySelectorAll('.presta').forEach(c=>c.onclick=()=>{F.presta=c.dataset.p;F.tarif=TARIFS[c.dataset.p];render()});
    document.querySelectorAll('.type').forEach(c=>c.onclick=()=>{F.type=c.dataset.t;render()});
    g('fTarif').onchange=e=>{F.tarif=Number(e.target.value)||0;render()};
    g('btnSave').onclick=()=>{
      if(!F.nom.trim()){toast('Nom client requis');return}
      const tx={id:Date.now(),date:F.date,nom:F.nom.trim(),contact:F.contact.trim(),presta:F.presta,
        slots:Number(F.slots)||1,tarif:Number(F.tarif)||0,montant:(Number(F.slots)||1)*(Number(F.tarif)||0),
        type:F.type,notes:F.notes.trim(),exporte:false};
      txs.unshift(tx); SV('hka_txs',txs);
      F={...F,nom:'',contact:'',notes:'',slots:1};
      toast('✓ '+fcfa(tx.montant)+' enregistré'); render();
    };
    bindPick();
  }
  function bindPick(){
    document.querySelectorAll('.pick').forEach(p=>p.onclick=()=>{
      F.nom=p.dataset.nom; F.contact=p.dataset.c;
      F.type=Number(p.dataset.s)>0?'Ancien':'Nouveau';
      render();
    });
  }
  if(tab==='journal'){
    document.querySelectorAll('.dayHead').forEach(h=>h.onclick=()=>{const d=h.dataset.d;if(d===today())return;openDays[d]=!openDays[d];render()});
    document.querySelectorAll('.delTx').forEach(b=>b.onclick=e=>{e.stopPropagation();txs=txs.filter(t=>t.id!=b.dataset.id);SV('hka_txs',txs);render()});
    document.querySelectorAll('.delDep').forEach(b=>b.onclick=e=>{e.stopPropagation();deps=deps.filter(t=>t.id!=b.dataset.id);SV('hka_deps',deps);render()});
  }
  if(tab==='periode'){
    g('mPrev').onclick=()=>{perM--;if(perM<0){perM=11;perY--}render()};
    g('mNext').onclick=()=>{perM++;if(perM>11){perM=0;perY++}render()};
  }
  if(tab==='clients'){
    g('cSearch').oninput=e=>{clientSearch=e.target.value;render();const s=g('cSearch');s.focus();s.setSelectionRange(s.value.length,s.value.length)};
    g('btnAddClient').onclick=()=>{
      const n=g('ncNom').value.trim(), c=g('ncContact').value.trim();
      if(!n){toast('Nom requis');return}
      if(allClients().some(x=>x.c&&c&&x.c===c)){toast('Ce numéro existe déjà');return}
      newClients.unshift({id:Date.now(),n,c,v:'🆕 Nouveau',s:0,exporte:false});
      SV('hka_newclients',newClients); toast('✓ Client ajouté'); render();
    };
    document.querySelectorAll('.delCl').forEach(b=>b.onclick=()=>{newClients=newClients.filter(x=>x.id!=b.dataset.id);SV('hka_newclients',newClients);render()});
    const rt=g('relToggle'); if(rt) rt.onclick=()=>{relOpen=!relOpen;render()};
    document.querySelectorAll('.relDone').forEach(b=>b.onclick=()=>{
      relanced[b.dataset.nom]={d:today(),k:b.dataset.k};
      SV('hka_relanced',relanced); toast('✓ Relance notée'); render();
    });
    document.querySelectorAll('.quickTx').forEach(b=>b.onclick=()=>{
      const nom=b.dataset.nom;
      const last=txs.find(t=>t.nom===nom&&t.presta); // txs triées récentes d'abord
      const presta=last?last.presta:'Journée';
      F={...F,date:today(),nom,contact:b.dataset.c,presta,tarif:last?last.tarif:TARIFS[presta],type:Number(b.dataset.s)>0?'Ancien':'Nouveau',slots:1,notes:''};
      tab='saisie'; render(); toast('Pré-rempli — vérifie et enregistre');
    });
  }
  if(tab==='export'){
    const bx=g('btnXlsx'); if(bx) bx.onclick=downloadXlsx;
    const bk=g('btnBackup'); if(bk) bk.onclick=()=>{
      const blob=new Blob([JSON.stringify({txs,newClients,deps,relanced,lastExport,exportedAt:new Date().toISOString()},null,1)],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);
      a.download='HKA_backup_'+today()+'.json';document.body.appendChild(a);a.click();a.remove();
      lastBackup=Date.now();SV('hka_lastbackup',lastBackup);
      setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('✓ Sauvegarde téléchargée');render();
    };
    const m=g('btnMark'); if(m) m.onclick=()=>{
      txs=txs.map(t=>({...t,exporte:true})); newClients=newClients.map(c=>({...c,exporte:true})); deps=deps.map(d=>({...d,exporte:true}));
      lastExport=Date.now();
      SV('hka_txs',txs); SV('hka_newclients',newClients); SV('hka_deps',deps); SV('hka_lastexport',lastExport);
      toast('✓ Marqué exporté'); render();
    };
    const p=g('btnPurge'); if(p) p.onclick=()=>{
      const nb=txs.filter(t=>t.exporte).length;
      if(!confirm('Supprimer définitivement les '+nb+' transactions exportées de l\'app ?\nAssure-toi qu\'elles sont bien dans le classeur.')) return;
      txs=txs.filter(t=>!t.exporte); newClients=newClients.filter(c=>!c.exporte); deps=deps.filter(d=>!d.exporte);
      SV('hka_txs',txs); SV('hka_newclients',newClients); SV('hka_deps',deps);
      toast('✓ Nettoyage fait'); render();
    };
  }
}
render();
</script>
